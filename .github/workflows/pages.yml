name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    # Skip on the theme repo itself — theme is not published via Pages.
    if: github.repository != 'Catalyst-Real-Estate/property-site-theme'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install HTMLHint
        run: npm install -g htmlhint
      - name: Run HTMLHint
        run: htmlhint "**/*.html"

  deploy:
    if: github.repository != 'Catalyst-Real-Estate/property-site-theme'
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      # Publish only the site. Repo docs, notes and tooling (Markdown, docs/, workers,
      # scripts, config) stay in the repo but never reach the public domain.
      # A property repo can list extra rsync exclude patterns in .pagesignore.
      - name: Stage public files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.htmlhintrc' \
            --exclude='.templatesyncignore' \
            --exclude='.pagesignore' \
            --exclude='*.md' \
            --exclude='/docs/' \
            --exclude='/capi-worker/' \
            --exclude='/scripts/' \
            --exclude='/property-sites.json' \
            $( [ -f .pagesignore ] && echo "--exclude-from=.pagesignore" ) \
            ./ _site/
          echo "Publishing:"
          find _site -type f | sort
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
